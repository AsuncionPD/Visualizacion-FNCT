
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Dashboard de Proyectos Científicos | FNCT 2025
    </title>

    <!-- ==========================================
         APLICAR TEMA ANTES DE CARGAR REACT
    ========================================== -->

    <script>
      (function () {
        let theme = 'dark';

        try {
          const savedTheme = localStorage.getItem(
            'dashboard-theme'
          );

          theme = savedTheme === 'light'
            ? 'light'
            : 'dark';
        } catch (error) {
          theme = 'dark';
        }

        document.documentElement.setAttribute(
          'data-theme',
          theme
        );
      })();
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
